<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#061109" />
<title>FK SprintGate</title>
<style>
:root{color-scheme:dark;--bg:#061109;--card:#0d1b11;--green:#34d058;--muted:#9aa7a0;--warn:#ffb020;--red:#ff365e;--cyan:#00e5ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#030805,var(--bg));font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#fff;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px)}
h1{font-size:28px;margin:6px 0 2px}.sub{color:var(--muted);margin:0 0 14px}.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:14px;margin:12px 0}.row{display:flex;gap:10px;align-items:center}.statusDot{width:10px;height:10px;border-radius:99px;background:var(--warn);flex:none}
button{appearance:none;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;background:var(--green);color:#031006;width:100%}button.secondary{background:#17251b;color:#fff;border:1px solid rgba(255,255,255,.12)}button:disabled{opacity:.45}
.videoWrap{position:relative;overflow:hidden;border-radius:18px;background:#000;aspect-ratio:9/16;max-height:70vh;touch-action:none}video{width:100%;height:100%;object-fit:cover;display:block}.gateLine{position:absolute;top:0;bottom:0;width:30px;background:rgba(255,54,94,.20);border-left:3px solid var(--red);border-right:3px solid var(--red);left:50%;transform:translateX(-50%);box-shadow:0 0 18px rgba(255,54,94,.65)}.gateTag{position:absolute;top:12px;transform:translateX(-50%);background:var(--red);padding:6px 10px;border-radius:9px;font-size:11px;font-weight:900;left:50%;white-space:nowrap}.flashMarker{position:absolute;width:44px;height:44px;border:3px solid #ffe600;border-radius:50%;transform:translate(-50%,-50%);left:50%;top:18%;box-shadow:0 0 18px rgba(255,230,0,.5)}.flashMarker:after{content:"STARTLICHT";position:absolute;top:46px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;background:rgba(0,0,0,.65);padding:3px 5px;border-radius:5px;white-space:nowrap}
label{font-size:13px;color:var(--muted);display:block;margin:9px 0 4px}input[type=range]{width:100%}.big{font-size:62px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}.resultMeta{text-align:center;color:var(--muted)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(52,208,88,.13);color:#7df296;font-size:12px;font-weight:700}.warn{color:var(--warn);font-size:12px}.help{font-size:13px;color:var(--muted);line-height:1.45}.hidden{display:none!important}.debug{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;color:#86938b;white-space:pre-wrap}.syncGood{color:#7df296}.syncWarn{color:var(--warn)}canvas{display:none}
</style>
</head>
<body>
<main>
<div class="pill" id="rolePill">Safari-Zielgerät · keine App</div>
<h1>FK SprintGate</h1>
<p class="sub" id="runMeta">Ziel-Gate vorbereiten</p>
<section class="card"><div class="row"><span class="statusDot" id="dot"></span><strong id="stateText">Kamera noch nicht gestartet</strong></div></section>
<section class="card hidden" id="syncCard"><div class="row"><span class="statusDot" id="syncDot"></span><strong>Zeitsynchronisation</strong></div><p class="help" id="syncText">Noch nicht synchronisiert.</p><button id="syncBtn" class="secondary">Jetzt synchronisieren</button></section>
<section class="videoWrap" id="videoWrap"><video id="video" playsinline muted></video><div class="gateLine" id="gateLine"></div><div class="gateTag" id="gateTag">ZIEL-SCHRANKE</div><div class="flashMarker" id="flashMarker"></div></section>
<canvas id="canvas" width="320" height="180"></canvas>
<section class="card"><button id="cameraBtn">Kamera starten</button><div id="controls" class="hidden"><p class="help" id="instruction"></p><label>Ziel-Schranke verschieben</label><input id="lineSlider" type="range" min="10" max="90" value="50" step="1" /><details><summary>Empfindlichkeit</summary><div id="flashSettings"><label>Startlicht-Schwelle <span id="flashV">38</span></label><input id="flashSlider" type="range" min="12" max="90" value="38" step="1" /></div><label>Zielbewegung <span id="motionV">12</span>%</label><input id="motionSlider" type="range" min="4" max="40" value="12" step="1" /></details><div style="height:10px"></div><button id="armBtn">Ziel-Gate scharf schalten</button><div style="height:8px"></div><button id="resetBtn" class="secondary">Zurücksetzen</button><p class="warn">Prototyp: Genauigkeit vor Verkauf gegen eine echte Lichtschranke prüfen.</p></div></section>
<section class="card hidden" id="resultCard"><div class="resultMeta" id="resultPlayer"></div><div class="big" id="resultTime">0.000 s</div><div class="resultMeta" id="resultSpeed"></div><div style="height:14px"></div><button id="shareBtn">Ergebnis teilen</button><div style="height:8px"></div><button id="newBtn" class="secondary">Neuer Lauf</button></section>
<section class="card"><div class="help" id="principle"></div><div class="debug" id="debug"></div></section>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const params=new URLSearchParams(location.search),distance=Math.max(1,Number(params.get('d'))||20),player=(params.get('p')||'').slice(0,60),cameraMode=params.get('sm')==='camera';
const host=params.get('host')||'',port=Number(params.get('port'))||8765,sid=params.get('sid')||'';
$('runMeta').textContent=`${player?player+' · ':''}${distance} m`;
$('rolePill').textContent='Safari-Zielgerät · keine App';
$('gateTag').textContent='ZIEL-SCHRANKE';
$('instruction').innerHTML=cameraMode?'<b>Kamera-Modus:</b> Dieses iPhone steht am ZIEL. Seitlich zur Laufbahn aufstellen und die rote ZIEL-SCHRANKE auf den tatsächlichen Ziel-Durchgangspunkt legen. Die ganze rote Zone ist die virtuelle Schranke. Es muss das START-iPhone nicht sehen.':'<b>Licht-Modus:</b> Dieses iPhone steht am ZIEL. Tippe im Bild auf die sichtbare Stelle des Startlichts und lege die rote ZIEL-SCHRANKE auf den Ziel-Durchgangspunkt.';
$('principle').innerHTML=cameraMode?'<b>Kamera-Modus:</b> Haupt-iPhone = START, Safari-iPhone = ZIEL. Die Geräte müssen sich nicht anschauen. Nach der Zeitsynchronisation sendet dieses Zielgerät nur den Zeitstempel des Kameraframes, in dem die ZIEL-SCHRANKE durchquert wurde.':'<b>Licht-Modus:</b> Dieses Ziel-iPhone erkennt zuerst das Startlicht und danach den Zieleinlauf. Beide Zeitpunkte entstehen auf derselben Browser-Zeitbasis.';
if(cameraMode){$('flashMarker').classList.add('hidden');$('flashSettings').classList.add('hidden');$('syncCard').classList.remove('hidden');}
let stream=null,state='IDLE',flashX=.5,flashY=.18,gateX=.5,baselineSamples=[],baseline=0,startT=null,finishT=null,previousGray=null,motionStreak=0,lastFlashLuma=0,lastMotion=0,armedAt=0;
let syncOffset=null,syncRTT=null,syncSpread=null,lastSyncAt=0,previousMotionFrame=null,approachSide=null,sideFrames=0;
const setState=(s,text,color='#ffb020')=>{state=s;$('stateText').textContent=text;$('dot').style.background=color;};
function setMarker(){$('flashMarker').style.left=(flashX*100)+'%';$('flashMarker').style.top=(flashY*100)+'%';$('gateLine').style.left=(gateX*100)+'%';$('gateTag').style.left=(gateX*100)+'%';}setMarker();
$('cameraBtn').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60,max:60}}});video.srcObject=stream;await video.play();$('cameraBtn').classList.add('hidden');$('controls').classList.remove('hidden');setState('READY','Kamera bereit','#34d058');startFrameLoop();if(cameraMode)syncClocks();}catch(e){setState('ERROR','Kamera nicht verfügbar','#ff365e');alert('Kamerazugriff konnte nicht gestartet werden. Safari-Kameraberechtigung prüfen.');}};
$('videoWrap').onpointerup=ev=>{if(cameraMode)return;const r=$('videoWrap').getBoundingClientRect();flashX=Math.min(.96,Math.max(.04,(ev.clientX-r.left)/r.width));flashY=Math.min(.96,Math.max(.04,(ev.clientY-r.top)/r.height));setMarker();};
$('lineSlider').oninput=e=>{gateX=Number(e.target.value)/100;setMarker();};$('flashSlider').oninput=e=>$('flashV').textContent=e.target.value;$('motionSlider').oninput=e=>$('motionV').textContent=e.target.value;$('syncBtn').onclick=syncClocks;
$('armBtn').onclick=async()=>{startT=finishT=null;motionStreak=0;baselineSamples=[];previousGray=null;previousMotionFrame=null;approachSide=null;sideFrames=0;$('resultCard').classList.add('hidden');if(cameraMode){if(!Number.isFinite(syncOffset)||performance.now()-lastSyncAt>20000){const ok=await syncClocks();if(!ok)return;}armedAt=performance.now();setState('ARMED','SCHARF – warte auf Zieleinlauf','#34d058');return;}armedAt=performance.now();setState('CALIBRATING','Startlicht wird kalibriert…','#ffb020');setTimeout(()=>{baseline=baselineSamples.length?baselineSamples.reduce((a,b)=>a+b,0)/baselineSamples.length:lastFlashLuma;setState('ARMED','SCHARF – warte auf Startlicht','#34d058');},1300);};
function reset(){startT=finishT=null;motionStreak=0;baselineSamples=[];previousGray=null;previousMotionFrame=null;approachSide=null;sideFrames=0;$('resultCard').classList.add('hidden');setState(stream?'READY':'IDLE',stream?'Kamera bereit':'Kamera noch nicht gestartet',stream?'#34d058':'#ffb020');}$('resetBtn').onclick=reset;$('newBtn').onclick=reset;
async function localFetch(path,options={}){if(!host||!sid)throw new Error('Keine lokale App-Adresse im QR-Code');const url=`http://${host}:${port}${path}${path.includes('?')?'&':'?'}sid=${encodeURIComponent(sid)}`;try{return await fetch(url,{...options,cache:'no-store',targetAddressSpace:'local'});}catch(e){return await fetch(url,{...options,cache:'no-store'});}}
async function syncClocks(){if(!cameraMode)return true;if(!host||!sid){setSync(false,'Keine lokale App-Adresse. QR-Code neu aus SprintGate scannen.');return false;}setSync(null,'Synchronisiere …');const samples=[];for(let i=0;i<12;i++){try{const t0=performance.now(),response=await localFetch(`/ping?n=${i}&x=${Date.now()}`),payload=await response.json(),t3=performance.now();if(!payload.ok)continue;const t1=Number(payload.t1),t2=Number(payload.t2),rtt=(t3-t0)-(t2-t1),offset=((t1-t0)+(t2-t3))/2;if(Number.isFinite(rtt)&&Number.isFinite(offset)&&rtt>=0)samples.push({rtt,offset});}catch(e){}await new Promise(r=>setTimeout(r,35));}if(samples.length<4){setSync(false,'Synchronisation fehlgeschlagen. Gleiches WLAN/Hotspot verwenden und lokale Netzwerkfreigabe erlauben.');return false;}samples.sort((a,b)=>a.rtt-b.rtt);const best=samples.slice(0,Math.min(5,samples.length)),offsets=best.map(s=>s.offset).sort((a,b)=>a-b);syncOffset=offsets[Math.floor(offsets.length/2)];syncRTT=best[0].rtt;syncSpread=Math.max(...offsets)-Math.min(...offsets);lastSyncAt=performance.now();const good=syncRTT<=35&&syncSpread<=12;setSync(good,`Synchronisiert · RTT ${syncRTT.toFixed(1)} ms · Streuung ${syncSpread.toFixed(1)} ms${good?'':' · Verbindung prüfen'}`);try{await localFetch(`/sync?rtt=${encodeURIComponent(syncRTT)}&spread=${encodeURIComponent(syncSpread)}&offset=${encodeURIComponent(syncOffset)}`,{method:'POST'});}catch(e){}return true;}
function setSync(good,text){$('syncText').textContent=text;$('syncText').className='help '+(good===true?'syncGood':good===false?'syncWarn':'');$('syncDot').style.background=good===true?'#34d058':good===false?'#ff365e':'#ffb020';}
async function sendFinish(frameTime){if(!Number.isFinite(syncOffset))return;try{/* /start bleibt intern aus Kompatibilitätsgründen der Relay-Endpunkt */await localFetch(`/start?t=${encodeURIComponent(frameTime)}&offset=${encodeURIComponent(syncOffset)}&rtt=${encodeURIComponent(syncRTT||0)}`,{method:'POST'});setState('DONE','ZIEL erkannt und an Hauptgerät gesendet','#34d058');if(navigator.vibrate)navigator.vibrate(40);}catch(e){setState('ERROR','ZIEL erkannt – Übertragung fehlgeschlagen','#ff365e');}}
function frame(frameTime){if(video.readyState>=2){const W=320,H=180;canvas.width=W;canvas.height=H;ctx.drawImage(video,0,0,W,H);const image=ctx.getImageData(0,0,W,H).data;if(cameraMode){const current=grayFrame(image,W,H);if(state==='ARMED'&&frameTime-armedAt>300&&previousMotionFrame){const info=motionInfo(previousMotionFrame,current,gateX);lastMotion=info.ratio;const needed=Number($('motionSlider').value)/100;if(info.centroid!=null&&info.ratio>=needed*.35){const side=info.centroid<gateX-.035?-1:info.centroid>gateX+.035?1:null;if(approachSide==null&&side!=null){sideFrames=sideFrames+(window.__sideCandidate===side?1:-sideFrames);window.__sideCandidate=side;if(sideFrames>=2){approachSide=side;setState('ARMED','ZIEL bereit – Bewegung nähert sich','#34d058');}}else if(approachSide===-1&&info.centroid>gateX+.012){motionStreak++;}else if(approachSide===1&&info.centroid<gateX-.012){motionStreak++;}else{motionStreak=Math.max(0,motionStreak-1);}if(motionStreak>=2){finishT=frameTime;state='SENDING';sendFinish(frameTime);}}}previousMotionFrame=current;$('debug').textContent=`Zielbewegung ${(lastMotion*100).toFixed(1)}% · Richtung ${approachSide===-1?'links→rechts':approachSide===1?'rechts→links':'noch offen'} · Sync ${syncRTT==null?'–':syncRTT.toFixed(1)+' ms'}`;}else{lastFlashLuma=regionLuma(image,W,H,flashX,flashY);if(state==='CALIBRATING')baselineSamples.push(lastFlashLuma);if(state==='ARMED'&&frameTime-armedAt>1300){const threshold=Number($('flashSlider').value);if(lastFlashLuma>baseline+threshold){startT=frameTime;previousGray=grayBand(image,W,H,gateX,4);setState('RUNNING','START erkannt – warte auf Zieleinlauf','#00e5ff');if(navigator.vibrate)navigator.vibrate(35);}}else if(state==='RUNNING'&&startT&&frameTime-startT>350){const current=grayBand(image,W,H,gateX,4);if(previousGray){lastMotion=motionRatio(previousGray,current);const needed=Number($('motionSlider').value)/100;motionStreak=lastMotion>=needed?motionStreak+1:0;if(motionStreak>=2){finishT=frameTime;completeLightRun();}}previousGray=current;}$('debug').textContent=`Licht ${lastFlashLuma.toFixed(1)} · Basis ${baseline.toFixed(1)} · Zielbewegung ${(lastMotion*100).toFixed(1)}%`;}}scheduleFrame();}
function scheduleFrame(){if('requestVideoFrameCallback'in HTMLVideoElement.prototype)video.requestVideoFrameCallback((now,meta)=>frame(meta&&Number.isFinite(meta.expectedDisplayTime)?meta.expectedDisplayTime:now));else requestAnimationFrame(frame);}function startFrameLoop(){scheduleFrame();}
function regionLuma(data,W,H,nx,ny){const cx=Math.round(nx*W),cy=Math.round(ny*H),r=7;let sum=0,n=0;for(let y=Math.max(0,cy-r);y<Math.min(H,cy+r);y+=2)for(let x=Math.max(0,cx-r);x<Math.min(W,cx+r);x+=2){const i=(y*W+x)*4;sum+=.2126*data[i]+.7152*data[i+1]+.0722*data[i+2];n++;}return n?sum/n:0;}
function grayBand(data,W,H,nx,half=5){const cx=Math.round(nx*W),arr=[];for(let y=8;y<H-8;y+=2)for(let x=Math.max(0,cx-half);x<Math.min(W,cx+half);x+=2){const i=(y*W+x)*4;arr.push((data[i]+data[i+1]+data[i+2])/3);}return arr;}function motionRatio(a,b){const n=Math.min(a.length,b.length);let changed=0;for(let i=0;i<n;i++)if(Math.abs(a[i]-b[i])>24)changed++;return n?changed/n:0;}
function grayFrame(data,W,H){const arr=[];for(let y=8;y<H-8;y+=4)for(let x=0;x<W;x+=4){const i=(y*W+x)*4;arr.push({x:x/W,v:(data[i]+data[i+1]+data[i+2])/3});}return arr;}
function motionInfo(a,b,gx){const n=Math.min(a.length,b.length);let changed=0,total=0,sumX=0;for(let i=0;i<n;i++){const x=b[i].x;if(x<gx-.25||x>gx+.25)continue;total++;if(Math.abs(a[i].v-b[i].v)>24){changed++;sumX+=x;}}return{ratio:total?changed/total:0,centroid:changed?sumX/changed:null};}
function completeLightRun(){const seconds=(finishT-startT)/1000;if(!(seconds>.2&&seconds<60)){reset();return;}const speed=(distance/seconds)*3.6;$('resultTime').textContent=seconds.toFixed(3)+' s';$('resultPlayer').textContent=`${player||'Sprint'} · ${distance} m`;$('resultSpeed').textContent=`Ø ${speed.toFixed(2)} km/h`;$('resultCard').classList.remove('hidden');setState('DONE','ZIEL erkannt','#34d058');window.__lastResult={seconds,speed,distance,player,ts:new Date().toISOString()};}
$('shareBtn').onclick=async()=>{const r=window.__lastResult;if(!r)return;const text=`FK SprintGate\n${r.player?r.player+' · ':''}${r.distance} m\n${r.seconds.toFixed(3)} s · ${r.speed.toFixed(2)} km/h\nPrototypmessung`;try{if(navigator.share)await navigator.share({title:'FK SprintGate',text});else await navigator.clipboard.writeText(text);}catch(e){}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
