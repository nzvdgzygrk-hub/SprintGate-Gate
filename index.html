<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#061109" />
<title>FK SprintGate</title>
<style>
:root{color-scheme:dark;--bg:#061109;--card:#0d1b11;--green:#34d058;--muted:#9aa7a0;--warn:#ffb020;--red:#ff365e}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#030805,var(--bg));font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#fff;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px)}
h1{font-size:28px;margin:6px 0 2px}.sub{color:var(--muted);margin:0 0 14px}.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:14px;margin:12px 0}.row{display:flex;gap:10px;align-items:center}.statusDot{width:10px;height:10px;border-radius:99px;background:var(--warn);flex:none}
button{appearance:none;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;background:var(--green);color:#031006;width:100%}button.secondary{background:#17251b;color:#fff;border:1px solid rgba(255,255,255,.12)}button:disabled{opacity:.45}
.videoWrap{position:relative;overflow:hidden;border-radius:18px;background:#000;aspect-ratio:9/16;max-height:70vh;touch-action:none}video{width:100%;height:100%;object-fit:cover;display:block}.gateLine{position:absolute;top:0;bottom:0;width:30px;background:rgba(255,54,94,.20);border-left:3px solid var(--red);border-right:3px solid var(--red);left:50%;transform:translateX(-50%);box-shadow:0 0 18px rgba(255,54,94,.65)}.gateTag{position:absolute;top:12px;transform:translateX(-50%);background:var(--red);padding:6px 10px;border-radius:9px;font-size:11px;font-weight:900;left:50%;white-space:nowrap}
label{font-size:13px;color:var(--muted);display:block;margin:9px 0 4px}input[type=range]{width:100%}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(52,208,88,.13);color:#7df296;font-size:12px;font-weight:700}.warn{color:var(--warn);font-size:12px}.help{font-size:13px;color:var(--muted);line-height:1.45}.hidden{display:none!important}.debug{font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;color:#86938b;white-space:pre-wrap}.syncGood{color:#7df296}.syncWarn{color:var(--warn)}canvas{display:none}
</style>
</head>
<body>
<main>
<div class="pill">Safari-Zielgerät · keine App</div>
<h1>FK SprintGate</h1>
<p class="sub" id="runMeta">Ziel-Gate vorbereiten</p>
<section class="card"><div class="row"><span class="statusDot" id="dot"></span><strong id="stateText">Kamera noch nicht gestartet</strong></div></section>
<section class="card" id="syncCard"><div class="row"><span class="statusDot" id="syncDot"></span><strong>Zeitsynchronisation</strong></div><p class="help" id="syncText">Noch nicht synchronisiert.</p><button id="syncBtn" class="secondary">Jetzt synchronisieren</button></section>
<section class="videoWrap"><video id="video" playsinline muted></video><div class="gateLine" id="gateLine"></div><div class="gateTag" id="gateTag">ZIEL-SCHRANKE</div></section>
<canvas id="canvas" width="320" height="180"></canvas>
<section class="card"><button id="cameraBtn">Kamera starten</button><div id="controls" class="hidden"><p class="help" id="instruction"></p><label>Ziel-Schranke verschieben</label><input id="lineSlider" type="range" min="10" max="90" value="50" step="1" /><details><summary>Empfindlichkeit</summary><label>Zielbewegung <span id="motionV">12</span>%</label><input id="motionSlider" type="range" min="4" max="40" value="12" step="1" /></details><div style="height:10px"></div><button id="armBtn">Ziel-Gate scharf schalten</button><div style="height:8px"></div><button id="resetBtn" class="secondary">Zurücksetzen</button><p class="warn">Prototyp: Genauigkeit vor Verkauf gegen eine echte Lichtschranke prüfen.</p></div></section>
<section class="card"><div class="help" id="principle"></div><div class="debug" id="debug"></div></section>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const params=new URLSearchParams(location.search),distance=Math.max(1,Number(params.get('d'))||20),player=(params.get('p')||'').slice(0,60),mode=params.get('sm')==='camera'?'camera':'light';
const host=params.get('host')||'',port=Number(params.get('port'))||8765,sid=params.get('sid')||'';
$('runMeta').textContent=`${player?player+' · ':''}${distance} m · ZIEL`;
$('instruction').innerHTML='<b>ZIEL:</b> Dieses iPhone steht seitlich an der Ziellinie. Die rote ZIEL-SCHRANKE auf den tatsächlichen Durchgangspunkt legen. Das START-iPhone muss nicht im Kamerabild sichtbar sein.';
$('principle').innerHTML=mode==='light'
  ? '<b>Licht-Modus:</b> Das Haupt-iPhone setzt START selbst und gibt Licht/Ton. Dieses Safari-iPhone erkennt ausschließlich den Zieleinlauf. Der Blitz muss hier nicht sichtbar sein.'
  : '<b>Kamera-Modus:</b> Das Haupt-iPhone erkennt START per Kamera. Dieses Safari-iPhone erkennt ausschließlich ZIEL. Die beiden Kameras müssen sich nicht anschauen.';
let stream=null,state='IDLE',gateX=.5,motionStreak=0,lastMotion=0,armedAt=0,previousMotionFrame=null,approachSide=null,sideFrames=0,sideCandidate=null;
let syncOffset=null,syncRTT=null,syncSpread=null,lastSyncAt=0;
const setState=(s,text,color='#ffb020')=>{state=s;$('stateText').textContent=text;$('dot').style.background=color;};
function setMarker(){$('gateLine').style.left=(gateX*100)+'%';$('gateTag').style.left=(gateX*100)+'%';}setMarker();
$('cameraBtn').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60,max:60}}});video.srcObject=stream;await video.play();$('cameraBtn').classList.add('hidden');$('controls').classList.remove('hidden');setState('READY','Kamera bereit','#34d058');startFrameLoop();syncClocks();}catch(e){setState('ERROR','Kamera nicht verfügbar','#ff365e');alert('Kamerazugriff konnte nicht gestartet werden. Safari-Kameraberechtigung prüfen.');}};
$('lineSlider').oninput=e=>{gateX=Number(e.target.value)/100;setMarker();};
$('motionSlider').oninput=e=>$('motionV').textContent=e.target.value;
$('syncBtn').onclick=syncClocks;
$('armBtn').onclick=async()=>{motionStreak=0;previousMotionFrame=null;approachSide=null;sideFrames=0;sideCandidate=null;if(!Number.isFinite(syncOffset)||performance.now()-lastSyncAt>20000){const ok=await syncClocks();if(!ok)return;}armedAt=performance.now();setState('ARMED','SCHARF – warte auf Zieleinlauf','#34d058');};
$('resetBtn').onclick=()=>{motionStreak=0;previousMotionFrame=null;approachSide=null;sideFrames=0;sideCandidate=null;setState(stream?'READY':'IDLE',stream?'Kamera bereit':'Kamera noch nicht gestartet',stream?'#34d058':'#ffb020');};
async function localFetch(path,options={}){if(!host||!sid)throw new Error('Keine lokale App-Adresse im QR-Code');const url=`http://${host}:${port}${path}${path.includes('?')?'&':'?'}sid=${encodeURIComponent(sid)}`;try{return await fetch(url,{...options,cache:'no-store',targetAddressSpace:'local'});}catch(e){return await fetch(url,{...options,cache:'no-store'});}}
async function syncClocks(){if(!host||!sid){setSync(false,'Keine lokale App-Adresse. QR-Code neu aus der SprintGate-App scannen.');return false;}setSync(null,'Synchronisiere …');const samples=[];for(let i=0;i<12;i++){try{const t0=performance.now(),response=await localFetch(`/ping?n=${i}&x=${Date.now()}`),payload=await response.json(),t3=performance.now();if(!payload.ok)continue;const t1=Number(payload.t1),t2=Number(payload.t2),rtt=(t3-t0)-(t2-t1),offset=((t1-t0)+(t2-t3))/2;if(Number.isFinite(rtt)&&Number.isFinite(offset)&&rtt>=0)samples.push({rtt,offset});}catch(e){}await new Promise(r=>setTimeout(r,35));}if(samples.length<4){setSync(false,'Synchronisation fehlgeschlagen. Gleiches WLAN/Hotspot verwenden und lokale Netzwerkfreigabe erlauben.');return false;}samples.sort((a,b)=>a.rtt-b.rtt);const best=samples.slice(0,Math.min(5,samples.length)),offsets=best.map(s=>s.offset).sort((a,b)=>a-b);syncOffset=offsets[Math.floor(offsets.length/2)];syncRTT=best[0].rtt;syncSpread=Math.max(...offsets)-Math.min(...offsets);lastSyncAt=performance.now();const good=syncRTT<=35&&syncSpread<=12;setSync(good,`Synchronisiert · RTT ${syncRTT.toFixed(1)} ms · Streuung ${syncSpread.toFixed(1)} ms${good?'':' · Verbindung prüfen'}`);try{await localFetch(`/sync?rtt=${encodeURIComponent(syncRTT)}&spread=${encodeURIComponent(syncSpread)}&offset=${encodeURIComponent(syncOffset)}`,{method:'POST'});}catch(e){}return true;}
function setSync(good,text){$('syncText').textContent=text;$('syncText').className='help '+(good===true?'syncGood':good===false?'syncWarn':'');$('syncDot').style.background=good===true?'#34d058':good===false?'#ff365e':'#ffb020';}
async function sendFinish(frameTime){if(!Number.isFinite(syncOffset))return;try{await localFetch(`/start?t=${encodeURIComponent(frameTime)}&offset=${encodeURIComponent(syncOffset)}&rtt=${encodeURIComponent(syncRTT||0)}`,{method:'POST'});setState('DONE','ZIEL erkannt und an Hauptgerät gesendet','#34d058');if(navigator.vibrate)navigator.vibrate(40);}catch(e){setState('ERROR','ZIEL erkannt – Übertragung fehlgeschlagen','#ff365e');}}
function frame(frameTime){if(video.readyState>=2){const W=320,H=180;canvas.width=W;canvas.height=H;ctx.drawImage(video,0,0,W,H);const image=ctx.getImageData(0,0,W,H).data,current=grayFrame(image,W,H);if(state==='ARMED'&&frameTime-armedAt>300&&previousMotionFrame){const info=motionInfo(previousMotionFrame,current,gateX);lastMotion=info.ratio;const needed=Number($('motionSlider').value)/100;if(info.centroid!=null&&info.ratio>=needed*.35){const side=info.centroid<gateX-.035?-1:info.centroid>gateX+.035?1:null;if(approachSide==null&&side!=null){if(sideCandidate===side){sideFrames++;}else{sideCandidate=side;sideFrames=1;}if(sideFrames>=2){approachSide=side;setState('ARMED','ZIEL bereit – Bewegung nähert sich','#34d058');}}else if(approachSide===-1&&info.centroid>gateX+.012){motionStreak++;}else if(approachSide===1&&info.centroid<gateX-.012){motionStreak++;}else{motionStreak=Math.max(0,motionStreak-1);}if(motionStreak>=2){state='SENDING';sendFinish(frameTime);}}}previousMotionFrame=current;$('debug').textContent=`Zielbewegung ${(lastMotion*100).toFixed(1)}% · Richtung ${approachSide===-1?'links→rechts':approachSide===1?'rechts→links':'noch offen'} · Sync ${syncRTT==null?'–':syncRTT.toFixed(1)+' ms'}`;}scheduleFrame();}
function scheduleFrame(){if('requestVideoFrameCallback'in HTMLVideoElement.prototype)video.requestVideoFrameCallback((now,meta)=>frame(meta&&Number.isFinite(meta.expectedDisplayTime)?meta.expectedDisplayTime:now));else requestAnimationFrame(frame);}function startFrameLoop(){scheduleFrame();}
function grayFrame(data,W,H){const arr=[];for(let y=8;y<H-8;y+=4)for(let x=0;x<W;x+=4){const i=(y*W+x)*4;arr.push({x:x/W,v:(data[i]+data[i+1]+data[i+2])/3});}return arr;}
function motionInfo(a,b,gx){const n=Math.min(a.length,b.length);let changed=0,total=0,sumX=0;for(let i=0;i<n;i++){const x=b[i].x;if(x<gx-.25||x>gx+.25)continue;total++;if(Math.abs(a[i].v-b[i].v)>24){changed++;sumX+=x;}}return{ratio:total?changed/total:0,centroid:changed?sumX/changed:null};}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
