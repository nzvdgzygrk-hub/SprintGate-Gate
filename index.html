<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#061109" />
<title>FK SprintGate · Ziel</title>
<style>
:root{color-scheme:dark;--bg:#061109;--card:#0c1710;--line:rgba(255,255,255,.10);--green:#34d058;--muted:#95a29a;--warn:#ffb020;--red:#ff365e}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#020604,var(--bg));font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#fff;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 22px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 10px}.brand{font-size:22px;font-weight:900}.role{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:rgba(52,208,88,.12);color:#7df296}.meta{color:var(--muted);font-size:13px;margin-top:3px}
.statusGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.status{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 8px;text-align:center}.statusName{font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:900}.statusValue{font-size:13px;font-weight:900;margin-top:5px;white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:5px}.ok .dot{background:var(--green)}.bad .dot{background:var(--red)}
.videoWrap{position:relative;overflow:hidden;border-radius:20px;background:#000;aspect-ratio:9/16;max-height:66vh;border:1px solid var(--line)}video{width:100%;height:100%;object-fit:cover;display:block}.gateLine{position:absolute;top:0;bottom:0;width:30px;background:rgba(255,54,94,.20);border-left:3px solid var(--red);border-right:3px solid var(--red);left:50%;transform:translateX(-50%);box-shadow:0 0 18px rgba(255,54,94,.55)}.gateTag{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--red);padding:6px 10px;border-radius:9px;font-size:11px;font-weight:900;white-space:nowrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:10px}button{appearance:none;border:0;width:100%;border-radius:14px;padding:15px 14px;font-size:16px;font-weight:900;background:var(--green);color:#031006}button.secondary{background:#17231a;color:#fff;border:1px solid var(--line)}button:disabled{opacity:.45}.hidden{display:none!important}label{font-size:12px;color:var(--muted);display:block;margin:10px 0 4px}input[type=range]{width:100%}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(52,208,88,.13);color:#7df296;font-size:12px;font-weight:700}.hint{font-size:12px;color:var(--muted);line-height:1.4;margin:8px 2px 0}.tiny{font-size:10px;color:#718078;font-family:ui-monospace,SFMono-Regular,monospace;margin-top:8px}.warn{font-size:11px;color:var(--warn);margin-top:8px}canvas{display:none}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><div class="brand">FK SprintGate</div><div class="meta" id="runMeta">Zielgerät</div></div>
    <div class="role">SAFARI · ZIEL</div>
  </div>

  <div class="statusGrid">
    <div class="status" id="syncStatus"><div class="statusName">SYNC</div><div class="statusValue"><span class="dot"></span><span id="syncValue">WARTET</span></div></div>
    <div class="status" id="startStatus"><div class="statusName">START</div><div class="statusValue"><span class="dot"></span><span id="startValue">WARTET</span></div></div>
    <div class="status" id="goalStatus"><div class="statusName">ZIEL</div><div class="statusValue"><span class="dot"></span><span id="goalValue">WARTET</span></div></div>
  </div>

  <div class="videoWrap"><video id="video" playsinline muted></video><div class="gateLine" id="gateLine"></div><div class="gateTag" id="gateTag">ZIEL-SCHRANKE</div></div>
  <canvas id="canvas" width="320" height="180"></canvas>

  <div class="panel">
    <button id="cameraBtn">KAMERA STARTEN</button>
    <div id="controls" class="hidden">
      <button id="armBtn">ZIEL SCHARF SCHALTEN</button>
      <label>Ziel-Schranke verschieben</label>
      <input id="lineSlider" type="range" min="10" max="90" value="50" step="1" />
      <details><summary>Feineinstellung</summary><label>Empfindlichkeit <span id="motionV">12</span>%</label><input id="motionSlider" type="range" min="4" max="40" value="12" step="1" /></details>
      <div style="height:8px"></div>
      <button id="resetBtn" class="secondary">NEUER LAUF</button>
      <div class="hint">Dieses iPhone steht seitlich am Ziel. Nur die rote ZIEL-SCHRANKE zählt. Das START-iPhone muss nicht im Bild sein.</div>
      <div class="tiny" id="diag"></div>
      <div class="warn">Prototyp: Genauigkeit vor Verkauf gegen eine echte Lichtschranke validieren.</div>
    </div>
  </div>
</main>
<script>
(async()=>{
'use strict';

// Alte SprintGate-Service-Worker entfernen. Local-Network-Requests müssen direkt
// aus diesem sichtbaren Dokument kommen, damit Safari die LNA-Prüfung/Freigabe
// korrekt durchführen kann.
if('serviceWorker' in navigator){
  try{
    const hadController=!!navigator.serviceWorker.controller;
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r=>r.unregister()));
    if(hadController && sessionStorage.getItem('sg-sw-cleared')!=='1'){
      sessionStorage.setItem('sg-sw-cleared','1');
      location.reload();
      return;
    }
  }catch(e){}
}

const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const params=new URLSearchParams(location.search);
const distance=Math.max(1,Number(params.get('d'))||20),player=(params.get('p')||'').slice(0,60),mode=params.get('sm')==='camera'?'camera':'light';
const host=params.get('host')||'',port=Number(params.get('port'))||8765,statusPort=Number(params.get('sport'))||8766,sid=params.get('sid')||'';
$('runMeta').textContent=`${player?player+' · ':''}${distance} m · ${mode==='light'?'Licht-START':'Kamera-START'}`;
let stream=null,state='IDLE',gateX=.5,motionStreak=0,lastMotion=0,armedAt=0,previousMotionFrame=null,approachSide=null,sideFrames=0,sideCandidate=null;
let syncOffset=null,syncRTT=null,syncSpread=null,lastSyncAt=0,statusTimer=null,lastNetworkError='';

function paintStatus(id,value,text){const el=$(id);el.classList.remove('ok','bad');if(value===true)el.classList.add('ok');if(value===false)el.classList.add('bad');$(id==='syncStatus'?'syncValue':id==='startStatus'?'startValue':'goalValue').textContent=text;}
function setMarker(){$('gateLine').style.left=(gateX*100)+'%';$('gateTag').style.left=(gateX*100)+'%';}setMarker();

async function localFetch(path,options={}){
  if(!host||!sid)throw new Error('QR-Code ohne lokale App-Adresse');
  const url=`http://${host}:${port}${path}${path.includes('?')?'&':'?'}sid=${encodeURIComponent(sid)}`;
  try{
    return await fetch(url,{...options,cache:'no-store',targetAddressSpace:'local'});
  }catch(firstError){
    lastNetworkError=firstError?.message||String(firstError);
    try{return await fetch(url,{...options,cache:'no-store'});}
    catch(secondError){lastNetworkError=secondError?.message||String(secondError);throw secondError;}
  }
}
async function statusFetch(){if(!host||!sid)return null;const url=`http://${host}:${statusPort}/status?sid=${encodeURIComponent(sid)}&x=${Date.now()}`;try{let r;try{r=await fetch(url,{cache:'no-store',targetAddressSpace:'local'});}catch(e){r=await fetch(url,{cache:'no-store'});}return await r.json();}catch(e){lastNetworkError=e?.message||String(e);return null;}}

async function syncClocks(){if(!host||!sid){paintStatus('syncStatus',false,'KEIN LINK');$('diag').textContent='QR-Code neu aus der SprintGate-App scannen.';return false;}paintStatus('syncStatus',null,'SYNC…');lastNetworkError='';const samples=[];for(let i=0;i<12;i++){try{const t0=performance.now(),response=await localFetch(`/ping?n=${i}&x=${Date.now()}`),payload=await response.json(),t3=performance.now();if(!payload.ok)continue;const t1=Number(payload.t1),t2=Number(payload.t2),rtt=(t3-t0)-(t2-t1),offset=((t1-t0)+(t2-t3))/2;if(Number.isFinite(rtt)&&Number.isFinite(offset)&&rtt>=0)samples.push({rtt,offset});}catch(e){}await new Promise(r=>setTimeout(r,35));}if(samples.length<4){paintStatus('syncStatus',false,'FEHLER');$('diag').textContent=lastNetworkError?`Lokale Verbindung: ${lastNetworkError}`:'Keine Antwort von der SprintGate-App.';return false;}samples.sort((a,b)=>a.rtt-b.rtt);const best=samples.slice(0,Math.min(5,samples.length)),offsets=best.map(s=>s.offset).sort((a,b)=>a-b);syncOffset=offsets[Math.floor(offsets.length/2)];syncRTT=best[0].rtt;syncSpread=Math.max(...offsets)-Math.min(...offsets);lastSyncAt=performance.now();const good=syncRTT<=35&&syncSpread<=12;paintStatus('syncStatus',good,good?'BEREIT':'PRÜFEN');try{await localFetch(`/sync?rtt=${encodeURIComponent(syncRTT)}&spread=${encodeURIComponent(syncSpread)}&offset=${encodeURIComponent(syncOffset)}`,{method:'POST'});}catch(e){}$('diag').textContent=`RTT ${syncRTT.toFixed(1)} ms · Streuung ${syncSpread.toFixed(1)} ms`;return true;}

async function pollStart(){const data=await statusFetch();if(data&&data.ok){paintStatus('startStatus',data.started===true,data.started===true?'ERKANNT':'WARTET');}}
function beginStatusPolling(){if(statusTimer)clearInterval(statusTimer);pollStart();statusTimer=setInterval(pollStart,250);}

$('cameraBtn').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60,max:60}}});video.srcObject=stream;await video.play();$('cameraBtn').classList.add('hidden');$('controls').classList.remove('hidden');startFrameLoop();const ok=await syncClocks();if(ok)beginStatusPolling();}catch(e){paintStatus('syncStatus',false,'KAMERA?');alert('Kamera konnte nicht gestartet werden. Safari-Kameraberechtigung prüfen.');}};
$('lineSlider').oninput=e=>{gateX=Number(e.target.value)/100;setMarker();};
$('motionSlider').oninput=e=>$('motionV').textContent=e.target.value;

$('armBtn').onclick=async()=>{motionStreak=0;previousMotionFrame=null;approachSide=null;sideFrames=0;sideCandidate=null;paintStatus('goalStatus',null,'WARTET');if(!Number.isFinite(syncOffset)||performance.now()-lastSyncAt>20000){const ok=await syncClocks();if(!ok)return;}armedAt=performance.now();state='ARMED';$('armBtn').textContent='ZIEL IST SCHARF';$('armBtn').disabled=true;beginStatusPolling();};
$('resetBtn').onclick=()=>{state='READY';motionStreak=0;previousMotionFrame=null;approachSide=null;sideFrames=0;sideCandidate=null;paintStatus('startStatus',null,'WARTET');paintStatus('goalStatus',null,'WARTET');$('armBtn').textContent='ZIEL SCHARF SCHALTEN';$('armBtn').disabled=false;syncClocks().then(ok=>{if(ok)beginStatusPolling();});};

async function sendFinish(frameTime){if(!Number.isFinite(syncOffset))return;try{await localFetch(`/start?t=${encodeURIComponent(frameTime)}&offset=${encodeURIComponent(syncOffset)}&rtt=${encodeURIComponent(syncRTT||0)}`,{method:'POST'});paintStatus('goalStatus',true,'ERFASST');state='DONE';$('armBtn').textContent='ZIEL ERFASST';if(navigator.vibrate)navigator.vibrate(40);}catch(e){paintStatus('goalStatus',false,'SENDEN?');state='ERROR';}}

function frame(frameTime){if(video.readyState>=2){const W=320,H=180;canvas.width=W;canvas.height=H;ctx.drawImage(video,0,0,W,H);const image=ctx.getImageData(0,0,W,H).data,current=grayFrame(image,W,H);if(state==='ARMED'&&frameTime-armedAt>300&&previousMotionFrame){const info=motionInfo(previousMotionFrame,current,gateX);lastMotion=info.ratio;const needed=Number($('motionSlider').value)/100;if(info.centroid!=null&&info.ratio>=needed*.35){const side=info.centroid<gateX-.035?-1:info.centroid>gateX+.035?1:null;if(approachSide==null&&side!=null){if(sideCandidate===side){sideFrames++;}else{sideCandidate=side;sideFrames=1;}if(sideFrames>=2)approachSide=side;}else if(approachSide===-1&&info.centroid>gateX+.012){motionStreak++;}else if(approachSide===1&&info.centroid<gateX-.012){motionStreak++;}else{motionStreak=Math.max(0,motionStreak-1);}if(motionStreak>=2){state='SENDING';sendFinish(frameTime);}}}previousMotionFrame=current;if(syncRTT!=null)$('diag').textContent=`RTT ${syncRTT.toFixed(1)} ms · Bewegung ${(lastMotion*100).toFixed(1)}%`;}
scheduleFrame();}
function scheduleFrame(){if('requestVideoFrameCallback'in HTMLVideoElement.prototype)video.requestVideoFrameCallback((now,meta)=>frame(meta&&Number.isFinite(meta.expectedDisplayTime)?meta.expectedDisplayTime:now));else requestAnimationFrame(frame);}function startFrameLoop(){scheduleFrame();}
function grayFrame(data,W,H){const arr=[];for(let y=8;y<H-8;y+=4)for(let x=0;x<W;x+=4){const i=(y*W+x)*4;arr.push({x:x/W,v:(data[i]+data[i+1]+data[i+2])/3});}return arr;}
function motionInfo(a,b,gx){const n=Math.min(a.length,b.length);let changed=0,total=0,sumX=0;for(let i=0;i<n;i++){const x=b[i].x;if(x<gx-.25||x>gx+.25)continue;total++;if(Math.abs(a[i].v-b[i].v)>24){changed++;sumX+=x;}}return{ratio:total?changed/total:0,centroid:changed?sumX/changed:null};}
})();
</script>
</body>
</html>
